services:
  postgresdb:
    # pgvector-enabled Postgres (drop-in replacement for postgres:15).
    # Ships the `vector` extension used for embedding similarity search.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: postgresdb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once on first boot of an empty data dir: enables the vector extension.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
