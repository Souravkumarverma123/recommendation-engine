# Production deploy — run on the EC2 box via scripts/deploy.sh. No Postgres service:
# the database is Neon (external, managed). Only Caddy publishes ports; api/web are
# reached exclusively through it, on one domain, over HTTPS.
services:
  api:
    image: ghcr.io/souravkumarverma123/recommendation-engine-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: prod
    expose:
      - "8000"

  web:
    image: ghcr.io/souravkumarverma123/recommendation-engine-web:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
